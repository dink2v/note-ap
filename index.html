<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#00B3B3">
  <meta name="description" content="Note AP — workspace perencanaan dan pengelolaan konten Apotek Prapatan.">
  <title>Note AP — Apotek Prapatan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">N<span>·</span></div>
        <div><strong>Note AP</strong><small>APOTEK PRAPATAN</small></div>
        <button class="icon-button sidebar-close" id="sidebarClose" aria-label="Tutup menu">×</button>
      </div>
      <div class="workspace-label">WORKSPACE</div>
      <div class="workspace-card"><div class="workspace-avatar">AP</div><div><strong>Apotek Prapatan</strong><small>Content workspace</small></div><span class="chevron">⌄</span></div>
      <nav class="main-nav" aria-label="Navigasi utama">
        <button class="nav-item active" data-page="dashboard"><span class="nav-icon">▦</span>Dashboard</button>
        <button class="nav-item" data-page="calendar"><span class="nav-icon">▦</span>Kalender</button>
        <button class="nav-item" data-page="content"><span class="nav-icon">▤</span>Konten</button>
        <button class="nav-item" data-page="kanban"><span class="nav-icon">▥</span>Kanban Board</button>
      </nav>
      <div class="nav-section-title">SOCIALFIT AI <span class="insight-tag">INSIGHT</span></div>
      <nav class="main-nav">
        <button class="nav-item" data-page="analytics"><span class="nav-icon">◫</span>Analytics</button>
        <button class="nav-item" data-page="report"><span class="nav-icon">▧</span>Report</button>
      </nav>
      <div class="sidebar-bottom">
        <div class="nav-section-title">ADMIN</div>
        <button class="nav-item" data-page="settings"><span class="nav-icon">⚙</span>Setting</button>
        <button class="nav-item" data-page="help"><span class="nav-icon">?</span>Bantuan</button>
        <div class="profile-card"><div class="profile-avatar">AP</div><div><strong>Tim Apotek Prapatan</strong><small>Workspace member</small></div><span class="more">···</span></div>
      </div>
    </aside>
    <main class="main-area">
      <header class="topbar">
        <button class="icon-button menu-toggle" id="menuToggle" aria-label="Buka menu">☰</button>
        <div class="breadcrumb"><span>Apotek Prapatan</span><b>/</b><strong id="breadcrumbPage">Dashboard</strong></div>
        <div class="topbar-actions"><span class="live-dot"></span><span class="saved-label">Workspace aktif</span><button class="icon-button notification-button" aria-label="Notifikasi">♧<i></i></button><div class="top-avatar">AP</div></div>
      </header>
      <div id="pageContent" class="page-content"></div>
    </main>
  </div>
  <div class="toast" id="toast" role="status"></div>
  <div class="modal-backdrop" id="modalBackdrop"><section class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"></section></div>
  <script src="app.js"></script>
</body>
</html>
